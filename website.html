<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kevin Liu</title>
    <style>
      /* Google Fonts: Space Grotesk (headings) + Archivo (body).
         "Minimalist Portfolio" pairing — distinctive headers, clean body text.
         display=swap keeps text visible while the fonts load. */
      @import url("https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap");

      /* Design tokens (light mode) — monochrome zinc scale + one blue accent.
         Every color below meets a 4.5:1 contrast ratio against the background. */
      :root {
        --background: #fafafa;
        --text: #3f3f46;
        --muted-text: #52525b;
        --heading: #18181b;
        --line: #e4e4e7;
        --accent: #2563eb;
        --accent-hover: #1d4ed8;
        /* How much to invert icon images: 0 in light mode, ~1 in dark mode */
        --icon-invert: 0;
      }

      /* Dark mode: same tokens, remapped. Colors are lightened/desaturated
         variants — not simple inversions — and re-checked for contrast. */
      @media (prefers-color-scheme: dark) {
        :root {
          --background: #101012;
          --text: #d4d4d8;
          --muted-text: #a1a1aa;
          --heading: #fafafa;
          --line: #27272a;
          --accent: #60a5fa;
          --accent-hover: #93c5fd;
          --icon-invert: 0.9;
        }
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(8px);
        }

        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      body {
        font-family: "Archivo", "Helvetica Neue", Arial, sans-serif;
        color: var(--text);
        background-color: var(--background);
        max-width: 680px;
        margin: 0 auto;
        padding: 56px 24px;
        line-height: 1.6;
      }

      h1 {
        font-family: "Space Grotesk", "Helvetica Neue", Arial, sans-serif;
        font-size: 2.8em;
        color: var(--heading);
        font-weight: 600;
        letter-spacing: -0.03em;
        line-height: 1.1;
        margin-bottom: 0;
      }

      /* Entrance animation. "both" starts elements hidden until their
         delay elapses, so the stagger below doesn't flash content. */
      .fade-animation {
        animation: fadeIn 0.6s ease-out both;
        animation-delay: var(--stagger, 0s);
      }

      /* Stagger: each top-level section fades in slightly after the one
         above it. Children inherit --stagger from their section <div>. */
      body > div:nth-of-type(1) {
        --stagger: 0s;
      }

      body > div:nth-of-type(2) {
        --stagger: 0.08s;
      }

      body > div:nth-of-type(3) {
        --stagger: 0.16s;
      }

      body > div:nth-of-type(4) {
        --stagger: 0.24s;
      }

      /* Accessibility: turn off movement for users who ask for less motion */
      @media (prefers-reduced-motion: reduce) {
        .fade-animation {
          animation: none;
        }

        * {
          transition-duration: 0.01ms !important;
        }
      }

      #bio p {
        font-size: 1.05em;
        max-width: 580px;
        color: var(--muted-text);
      }

      .headings {
        font-family: "Space Grotesk", "Helvetica Neue", Arial, sans-serif;
        color: var(--heading);
        border-bottom: 1px solid var(--line);
        padding-bottom: 8px;
        margin-top: 48px;
        font-size: 0.85em;
        font-weight: 600;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .sub-headings {
        color: var(--muted-text);
        font-size: 0.95em;
        margin-top: 2px;
      }

      ul {
        list-style: none;
        padding-left: 0;
      }

      li {
        margin-bottom: 8px;
        font-weight: 500;
        color: var(--heading);
      }

      /* Contact row: flexbox instead of floats — icons on the left,
         email pushed to the right edge with margin-left: auto */
      .contact-list {
        margin-top: 0;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .contact-lists {
        margin-bottom: 0;
        font-size: 0.9em;
        font-weight: 400;
        color: var(--muted-text);
      }

      .contact-lists:last-child {
        margin-left: auto;
      }

      /* Icon links: padding grows the tap target to ~44x44px (touch
         accessibility) while the visible icon stays 24px */
      .contact-lists a {
        display: inline-flex;
        padding: 10px;
        margin: -10px 0;
        border-radius: 8px;
      }

      .contact-lists img {
        width: 24px;
        height: 24px;
        opacity: 0.7;
        /* Icons are near-black SVGs; invert them in dark mode (token above) */
        filter: invert(var(--icon-invert));
        transition:
          opacity 200ms ease-out,
          transform 200ms ease-out;
      }

      .contact-lists a:hover img {
        opacity: 1;
        transform: translateY(-2px);
      }

      a {
        color: var(--accent);
        text-decoration: none;
        font-weight: 500;
        transition: color 150ms ease-out;
      }

      a:hover {
        color: var(--accent-hover);
        text-decoration: underline;
        text-underline-offset: 3px;
      }

      /* Visible focus ring for keyboard navigation */
      a:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
        border-radius: 2px;
      }
    </style>
  </head>
  <body>

    <div>

          <a href="https://github.com/FRC2714/Crescendo-2024">Crescendo</a>,
          <a href="https://github.com/FRC2714/Reefscape-2025">Reefscape</a>, and
          <a href="https://github.com/FRC2714/BBQ-Rebuilt-2026">Rebuilt</a>
        </p>
        <li>TBD</li>
        <li>TBD</li>
      </ul>
    </div>

    <div>
      <h2 class="headings fade-animation">Contact</h2>
      <!-- TODO: replace "TBD Link" placeholders with real Email/GitHub/LinkedIn URLs -->
      <!-- TODO: add a small icon image (<img>) inside each <li>, before the <a> text, e.g. images/github-icon.png -->
      <ul class="contact-list fade-animation">
        <li class="contact-lists">
          <a href="TBD Link">

          </a>
        </li>

        <li class="contact-lists">
          <a href="TBD Link">
            <img src="images/linkedin.svg" alt="LinkedIn" />
          </a>
        </li>

        <li class="contact-lists">kvine.2714@gmail.com</li>
      </ul>
    </div>
  </body>
</html>
