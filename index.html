<!doctype html>
<html lang="en">
  <head>
    <meta name="keywords" content="HTML, CSS" />
    <meta name="description" content="This is a simple web page" />
    <title>My first web page</title>
    <style>
      img {
        width: 100px;
        border-radius: 10px;
        float: left;
        margin-right: 10px;
      }

      .username {
        font-weight: bold;
      }

      em {
        color: aqua;
        font-style: normal;
      }

      h1 {
        clear: left;
      }
    </style>
  </head>
  <body>
    <img src="images/me.jpeg" alt="this is me" />
    <p class="username">This is a picture of me.</p>
    <p>Its me again.</p>
    <p>My name is <em>Kevin</em>. <em>em</em> tag provides emphasis</p>
    <p>
      I am learning &lt; HTML &gt;. The gt and lt signs help create greater/less
      than
    </p>
    <h1>This is a heading</h1>
    <h2>This is a subheading</h2>
    <h3>This is a sub-subheading</h3>
    <h4>This is a sub-sub-subheading</h4>
    <a href="about.html">About Me</a>
    <br />
    <a href="me.jpeg">Click to see me</a>
  </body>
</html>
