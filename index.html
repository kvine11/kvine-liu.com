<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kevin Liu</title>
    <meta
      name="description"
      content="Kevin Liu — freshman at UCLA studying CS + Engineering, interested in software development, robotics, and AI."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <!-- Resolved before first paint, or a cream reload flashes dark. Has to
         stay inline and first — anything deferred is too late. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var light =
            stored === "light" ||
            (!stored &&
              window.matchMedia("(prefers-color-scheme: light)").matches);
          document.documentElement.dataset.theme = light ? "light" : "dark";
        } catch (e) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
  </head>
  <body>
    <!-- The only HTML file left. React mounts the whole site into #root. -->
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
